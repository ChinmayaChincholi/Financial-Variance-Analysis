# Render Blueprint for the hosted web demo. Optional: any host that can run
# the Dockerfile works. The offline desktop application does not use this.
services:
  - type: web
    name: variance-studio-demo
    runtime: docker
    # Deploys only from the web branch, so work on main never changes the
    # client's link.
    branch: web-demo
    autoDeploy: true
    healthCheckPath: /api/health
    # Free tier: sleeps after 15 minutes idle, data is erased on every
    # restart/redeploy, and memory is limited, so keep demo files small.
    plan: free
    envVars:
      - key: VARIANCE_STUDIO_MODE
        value: web
      # Keep uploads small and process one at a time on the free tier.
      - key: VARIANCE_STUDIO_MAX_UPLOAD_MB
        value: "10"
      - key: VARIANCE_STUDIO_MAX_CONCURRENT_JOBS
        value: "1"
      # Optional limits (these are the defaults):
      # - key: VARIANCE_STUDIO_RETENTION_HOURS
      #   value: "24"
    # Persistent disks are not available on the free plan, so none is used.